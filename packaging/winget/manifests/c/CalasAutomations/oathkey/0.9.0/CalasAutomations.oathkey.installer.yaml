# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.10.0.schema.json

PackageIdentifier: CalasAutomations.oathkey
PackageVersion: 0.9.0
InstallerType: zip
NestedInstallerType: portable
NestedInstallerFiles:
- RelativeFilePath: oathkey.cmd
# The folder goes on PATH, so `oathkey` finds oathkey.cmd. A symlinked alias
# is not used: winget names a .cmd link "oathkey.exe" (winget-cli #3807).
ArchiveBinariesDependOnPath: true
Dependencies:
  PackageDependencies:
  - PackageIdentifier: Python.Python.3.12
Installers:
- Architecture: neutral
  InstallerUrl: https://github.com/calasdan-sketch/oathkey/releases/download/v0.9.0/oathkey-0.9.0-windows.zip
  InstallerSha256: REPLACE_WITH_THE_SHA256_OF_THE_ZIP_FROM_SHA256SUMS
ManifestType: installer
ManifestVersion: 1.10.0
