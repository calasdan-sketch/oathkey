name: release

# Push a tag like v0.5.1 to publish that version to PyPI. One-time setup on
# pypi.org: add this repository and workflow (release.yml, environment "pypi")
# as a trusted publisher of the stuntkey project. No token is stored here.
# After PyPI, the same files get a build-provenance attestation (check one with
# `gh attestation verify <file> --repo calasdan-sketch/stuntkey`) and go on a
# GitHub release with a SHA256SUMS file, with stuntkey.pyz (runs on any
# Python 3.10+) and the Windows portable zip that winget installs.
#
# A release only goes out when ALL of these hold: the tag matches the version
# in pyproject.toml; the tagged commit is on main (a tag pushed from a side
# branch is refused); the tests pass on the oldest and newest Python; the
# sdist and wheel build, pass `twine check --strict`, and the sdist's own copy
# of the tests passes; the wheel installs into a clean environment.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    name: test (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run the tests
        run: python -m unittest discover -s tests

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0          # the whole history, so main can be compared with the tag
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: The tag must match the version in pyproject.toml
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match version ${version} in pyproject.toml" >&2
            exit 1
          fi
      - name: The tagged commit must be on main
        run: |
          git rev-parse --verify --quiet origin/main >/dev/null || {
            echo "origin/main was not fetched, so the tag cannot be checked against it" >&2
            exit 1
          }
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "commit ${GITHUB_SHA} (tag ${GITHUB_REF_NAME}) is not on main; merge it first" >&2
            exit 1
          fi
      - name: Build and check
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Run the tests from the sdist
        run: |
          mkdir "${RUNNER_TEMP}/sdist"
          tar -xzf dist/*.tar.gz -C "${RUNNER_TEMP}/sdist"
          cd "${RUNNER_TEMP}"/sdist/*/
          python -m unittest discover -s tests
      - name: Install the wheel into a clean environment
        run: |
          python -m venv "${RUNNER_TEMP}/wheel-venv"
          "${RUNNER_TEMP}/wheel-venv/bin/pip" install dist/*.whl
          "${RUNNER_TEMP}/wheel-venv/bin/stuntkey" --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
      # Kept out of dist/: PyPI takes only the sdist and the wheel.
      - name: Build the one-file stuntkey.pyz and the Windows portable zip
        run: |
          python scripts/build_pyz.py standalone
          python standalone/stuntkey.pyz --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: standalone
          path: standalone/

  publish:
    needs: [test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3

  github-release:
    needs: [publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write        # create the release
      id-token: write        # sign the attestation
      attestations: write    # store the attestation
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: standalone
          path: dist/
      - name: Write SHA256SUMS
        run: cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.pyz
            dist/*.zip
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}"             --verify-tag --title "${GITHUB_REF_NAME}"             --notes "See CHANGELOG.md. To check a file, run: sha256sum -c SHA256SUMS, or gh attestation verify <file> --repo ${GITHUB_REPOSITORY}"
