name: publish-shim-oathkey

# Publishes the small 'oathkey is now stuntkey' package in shim-oathkey/.
# Push a tag like shim-oathkey-v0.9.0 (must equal shim-oathkey/pyproject.toml's version, and be on main).
on:
  push:
    tags: ["shim-oathkey-v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Tag must match the shim version and be on main
        run: |
          ver=$(sed -n 's/^version = "\(.*\)"/\1/p' shim-oathkey/pyproject.toml)
          if [ "shim-oathkey-v${ver}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match shim version ${ver}" >&2
            exit 1
          fi
          git fetch origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
      - name: Build and check
        run: |
          python -m pip install --upgrade pip build twine
          cd shim-oathkey
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: dist
          path: shim-oathkey/dist/

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
