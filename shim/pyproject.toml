[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safeeasyapi"
version = "0.10.0"
description = "safeeasyapi has been renamed to stuntkey (formerly oathkey). This package only installs stuntkey and points to it."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Calas Automations Inc." }]
dependencies = ["stuntkey>=0.9.0"]
classifiers = [
    "Development Status :: 7 - Inactive",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://calasautomations.com/devtools/stuntkey/"
Source = "https://github.com/calasdan-sketch/stuntkey"
Issues = "https://github.com/calasdan-sketch/stuntkey/issues"

[project.scripts]
safeeasyapi = "safeeasyapi:main"

[tool.setuptools]
packages = ["safeeasyapi"]
