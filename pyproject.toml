[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "stuntkey"
version = "0.9.0"
description = "Let your AI use your API keys through stuntkey without ever holding them: guided one-command setup, brokered API calls, a self-attack test and an activity log. Reduces risk; not independently reviewed."
readme = "README.md"
license = "MIT"
authors = [{ name = "Calas Automations Inc." }]
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["api-key", "api-keys", "secrets", "dotenv", "env-file", "mcp", "cli", "ai", "llm", "agents", "keychain", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://calasautomations.com/devtools/stuntkey/"
Issues = "https://github.com/calasdan-sketch/stuntkey/issues"
Source = "https://github.com/calasdan-sketch/stuntkey"
Changelog = "https://github.com/calasdan-sketch/stuntkey/blob/main/CHANGELOG.md"
Documentation = "https://calasautomations.com/devtools/stuntkey/"
Security = "https://github.com/calasdan-sketch/stuntkey/security/policy"

[project.scripts]
stuntkey = "stuntkey.cli:main"

[tool.setuptools]
packages = ["stuntkey"]

[tool.setuptools.package-data]
stuntkey = ["recipes/*.json", "skill/*.md"]
